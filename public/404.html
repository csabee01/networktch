<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Network Technologies Kft</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #d6a100;
      --accent3: #f5c542;
      --accent2: #9f7300;
      --grad: linear-gradient(135deg, #d6a100, #f5c542, #9f7300);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #120f05;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      overflow: hidden;
    }

    /* háttér rács */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(214,161,0,0.10) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    /* háttér ragyogás */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 30%, rgba(214,161,0,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 80% 70%, rgba(159,115,0,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 520px;
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(214,161,0,0.20);
      border-radius: 28px;
      padding: 52px 48px 44px;
      backdrop-filter: blur(12px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(214,161,0,0.08);
      animation: fadeUp .6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
      text-decoration: none;
    }

    .logo-wrap img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 6px;
    }

    .logo-name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      line-height: 1.2;
    }

    .logo-name span {
      display: block;
      font-size: 11px;
      font-weight: 400;
      font-family: 'DM Sans', sans-serif;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: rgba(214,161,0,0.30);
      border-radius: 2px;
      margin: 0 auto 36px;
    }

    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 88px;
      font-weight: 400;
      line-height: 1;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      letter-spacing: -2px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: -.5px;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
      color: rgba(255,255,255,0.45);
      max-width: 340px;
      margin: 0 auto 36px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--grad);
      color: #fff;
      text-decoration: none;
      padding: 13px 28px;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .3px;
      box-shadow: 0 4px 28px rgba(214,161,0,0.30);
      transition: transform .2s, box-shadow .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 40px rgba(214,161,0,0.45);
    }

    .btn svg { flex-shrink: 0; }

    .footer-note {
      position: relative;
      z-index: 1;
      margin-top: 32px;
      font-size: 12px;
      color: rgba(255,255,255,0.18);
    }

    @media (max-width: 480px) {
      .card { padding: 40px 28px 36px; }
      .code { font-size: 68px; }
      h1    { font-size: 19px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <a href="/" class="logo-wrap">
      <img src="/pics/logo.png" alt="Network Technologies logó">
      <div class="logo-name">
        Network Technologies
        <span>Kft — Kecskemét</span>
      </div>
    </a>

    <div class="divider"></div>

    <div class="code">404</div>
    <h1>Az oldal nem található</h1>
    <p>A keresett oldal nem létezik, vagy áthelyezésre került. Lehet, hogy elgépelted a címet?</p>

    <a href="/" class="btn">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Vissza a főoldalra
    </a>
  </div>

  <div class="footer-note">© 2025 Network Technologies Kft — Minden jog fenntartva.</div>

</body>
</html>
