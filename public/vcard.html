<!DOCTYPE html>
<html>
<head>
  <title>NetworkTech Kontakt</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    .container {
      background-color: white;
      padding: 20px; /* Csökkentett belső margó mobilon */
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      text-align: center;
	 
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
    }

    .contact-button {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 32px;
      display: block; /* Sorba tördelés mobilon */
      margin-bottom: 10px; /* Távolság a gombok között mobilon */
      transition: background-color 0.3s ease;
	  margin-left:auto;
	  margin-right: auto;
    }

    .contact-button:hover {
      background-color: #0056b3;
    }

    .contact-button a {
      color: white; /* Linkek színe a gombokban */
      text-decoration: none; /* Linkek aláhúzásának eltávolítása */
    }

    @media (max-width: 600px) {
      .container {
        width: 90%; /* Teljes szélesség mobilon */
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="contact-button">Tóth Csaba</button>
    <button class="contact-button"><a href="mailto:info@networktch.com">Email: info@networktch.com</a></button>
    <button class="contact-button"><a href="tel:+36305870123">Tel: +36 30/587 0123</a></button>
    <button type="button" onclick="generateVCard()"><h1>Kontakt Mentése</h1></button>
  </div>

    <script>
        function generateVCard() {
            const firstName = "Tóth";
            const lastName = "Csaba";
            const email = "info@networktch.com";
            const phone = "+36305870123";
            const org = "Network Technologies Kft";
            const title = "Ügyvezető";
            const address = "Kecskemét";
            const website = "https://www.networktch.com";

            let vCardContent = `BEGIN:VCARD
VERSION:3.0
N:${lastName};${firstName};;;
FN:${firstName} ${lastName}
ORG:${org}
TITLE:${title}
EMAIL:${email}
TEL;TYPE=WORK,VOICE:${phone}
ADR;TYPE=WORK:;;${address};;;;
URL:${website}
END:VCARD`;

            const blob = new Blob([vCardContent], { type: "text/vcard" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${lastName}_${firstName}.vcf`;
            link.click();
        }
    </script>
</body>
</html>
